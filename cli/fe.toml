# The native CLI. Anchor source: a fixture or an RPC-supplied root.
# Hasher: software SHA-256.
#
# NOTE: this ingot deliberately does NOT set `target = "native"`, even though
# it only ever runs natively. A single workspace member with a `target` pins
# every member to that target, which silently compiled the whole workspace --
# including `verife`'s `#[cfg(target = "evm")]` code -- as native, so the EVM
# half was never tested. See docs/fe-findings.md. The CLI is built with
# `fe build --backend native -i cli` instead.
[ingot]
name = "cli"
version = "0.1.0"

[dependencies]
verife = { path = "../verife" }
