name: CI

on:
  push:
  pull_request:

permissions:
  contents: read

env:
  # Pinned for the contest. Do not bump mid-build-window.
  FE_VERSION: v26.7.0

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5

      - name: Install Fe
        run: |
          curl -fsSL https://raw.githubusercontent.com/argotorg/fe/master/feup/feup.sh \
            | bash -s -- --version "$FE_VERSION" --no-modify-path
          echo "$HOME/.fe/bin" >> "$GITHUB_PATH"

      - run: fe --version

      # `fe fmt` takes one path and does not walk workspace members, so each
      # ingot is checked on its own. See docs/fe-findings.md.
      - name: Format
        run: |
          for ingot in verife contract cli; do
            fe fmt --check "$ingot"
          done

      - run: fe check

      # These two must differ: the EVM run compiles the `#[cfg(target = "evm")]`
      # code (the SHA-256 precompile), the native run compiles it out. If a
      # workspace member ever sets `target` in its manifest, both runs silently
      # become that target. See docs/fe-findings.md.
      - name: Test (EVM backend)
        run: fe test

      - name: Test (native backend)
        run: fe test --backend native

      - name: Build the CLI
        run: fe build --backend native -i cli

      - name: Compile-fail suite
        run: tools/compile_fail.sh
