name: CI

on:
  push:
  pull_request:

permissions:
  contents: read

env:
  # Pinned for the contest. Do not bump mid-build-window.
  FE_VERSION: v26.7.0

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5

      - name: Install Fe
        run: |
          curl -fsSL https://raw.githubusercontent.com/argotorg/fe/master/feup/feup.sh \
            | bash -s -- --version "$FE_VERSION" --no-modify-path
          echo "$HOME/.fe/bin" >> "$GITHUB_PATH"

      - uses: actions/setup-node@v4
        with:
          node-version: 20

      # The independent half of the layout check: @lodestar/types hand-writes
      # the same containers in TypeScript, so a bug in the spec-markdown parser
      # cannot hide. Pinned by tools/package-lock.json.
      - name: Install the cross-check dependencies
        working-directory: tools
        run: npm ci

      # anvil and cast, for tools/fork_check.sh: the verifier is deployed onto a
      # fork of mainnet and its anchor source checked against the real
      # EIP-4788 contract. Without this the only leg `fe test` cannot reach
      # would go unexercised in CI.
      - uses: foundry-rs/foundry-toolchain@v1

      # The consensus-specs sources the layout numbers are derived from. They
      # are keyed by the pinned tag, so this cache only misses when the tag
      # changes.
      - name: Cache the consensus-specs sources
        uses: actions/cache@v4
        with:
          path: tools/cache/specs
          key: specs-v1.6.1

      # One command, the same one a judge runs locally: the pinned toolchain,
      # formatting, the workspace, both backends, the CLI build, the
      # compile-fail suite, the EIP-170 limit, the layout numbers against the
      # consensus specs and lodestar, and every fixture root re-derived from
      # hashlib. Nothing is skipped here, because everything it needs is
      # installed above.
      - name: ./check.sh
        run: |
          set -o pipefail
          ./check.sh | tee /tmp/check.out

          # A skip is acceptable on a laptop and not here. If the lodestar
          # cross-check, the fixture checks or the mainnet-fork check silently
          # stop running, CI must fail rather than report a green run that
          # checked less than it looks like. Everything check.sh needs is
          # installed above, so nothing should skip here at all.
          skipped=$(grep -c '^  skip' /tmp/check.out || true)
          if [ "$skipped" -gt 0 ]; then
            echo "::error::$skipped checks skipped; CI should skip nothing"
            grep '^  skip' /tmp/check.out
            exit 1
          fi
