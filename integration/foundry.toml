# `via_ir` is required, not a preference.
#
# `proveHistoricalCapellaStorageSlot` takes sixteen arguments -- the price of
# the typed-entry-point design, where each (anchor, target, field) combination
# is its own monomorphised function rather than a `bytes` blob the callee
# parses. That is what makes a wrong-fork proof a compile error instead of a
# revert, and the cost lands here: solc's legacy codegen cannot assemble a
# sixteen-argument external call without running out of stack slots, whatever
# the caller does with structs.
#
# So an integrator needs `via_ir = true`. Better to say so than to pretend the
# trade-off does not exist -- it is the first thing anyone writing an
# integration will hit.
[profile.default]
src = "."
out = "out"
libs = []
solc = "0.8.25"
via_ir = true
optimizer = true
optimizer_runs = 200
