# VeriFe workspace.
#
# `verife` is the core library: all proof logic lives there and nowhere else.
# `contract` and `cli` are thin targets over it; they differ only in where the
# anchor root and SHA-256 come from. `reader` is the execution-layer half --
# a separate contract because the two do not fit in one under EIP-170.
#
# `compile_fail` is deliberately excluded: its ingots must NOT compile, and each
# one records the diagnostic it is expected to produce.
[workspace]
name = "verife"
version = "0.1.0"

members = ["verife", "contract", "cli", "reader", "evm_mpt_tests"]

exclude = ["compile_fail", "out", "target", "tools", "bench", "fixtures"]
